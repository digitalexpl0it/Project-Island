# This file is expanded from templates at build time; see build.gradle (generateModMetadata).

modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
description='''
High-fantasy mythical RPG on procedural floating islands in the void: quests, staged
progression, dungeons, Skill Tree RPG classes (when pinned), and mounts (modpack stack),
plus server-authoritative island rules. Travel uses ropes, mounts, and tech like Create—
not Valkyrien Skies or Create Aeronautics. See README for pillars and roadmap.
'''

