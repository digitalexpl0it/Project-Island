plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.141'
    id 'idea'
}

tasks.named('wrapper', Wrapper).configure {
    // Define wrapper values here so as to not have to always do so when updating gradlew.properties.
    // Switching this to Wrapper.DistributionType.ALL will download the full gradle sources that comes with
    // documentation attached on cursor hover of gradle classes and methods. However, this comes with increased
    // file size for Gradle. If you do switch this to ALL, run the Gradle wrapper task twice afterwards.
    // (Verify by checking gradle/wrapper/gradle-wrapper.properties to see if distributionUrl now points to `-all`)
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

// Optional local secrets (gitignored); keys become project ext properties for findProperty().
def curseforgeLocalPropsFile = file('gradle.properties.local')
if (curseforgeLocalPropsFile.exists()) {
    def lp = new java.util.Properties()
    curseforgeLocalPropsFile.withInputStream { lp.load(it) }
    lp.each { k, v -> project.ext.set(k.toString(), v.toString()) }
}

// Dev-only: append_dev_timestamp_to_mod_version=true → project.version = mod_version+t<millis> each
// configuration (distinct jar / mods.toml version every ./gradlew build). Compatible with configuration
// cache. Releases: keep false and bump mod_version instead.
if (Boolean.parseBoolean(findProperty('append_dev_timestamp_to_mod_version')?.toString() ?: 'false')) {
    version = "${mod_version}+t${System.currentTimeMillis()}"
}

sourceSets.main.resources {
    // Include resources generated by data generators.
    srcDir('src/generated/resources')

    // Exclude common development only resources from finalized outputs
    exclude("**/*.bbmodel") // BlockBench project files
    exclude("src/generated/**/.cache") // datagen cache files
}

repositories {
    // Add here additional repositories if required by some of the dependencies below.
}

base {
    archivesName = mod_id
}

// Mojang ships Java 21 to end users in 1.21.1, so mods should target Java 21.
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    // Specify the version of NeoForge to use.
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    // Access transformers (see src/main/resources/META-INF/accesstransformer.cfg).
    accessTransformers = project.files('src/main/resources/META-INF/accesstransformer.cfg')

    // Default run configurations.
    // These can be tweaked, removed, or duplicated as needed.
    runs {
        client {
            client()
            gameDirectory = project.file('run-client')

            // Comma-separated list of namespaces to load gametests from. Empty = all namespaces.
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()
            gameDirectory = project.file('run-server')
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        // This run config launches GameTestServer and runs all registered gametests, then exits.
        // By default, the server will crash when no gametests are provided.
        // The gametest system is also enabled by default for other run configs under the /test command.
        gameTestServer {
            type = "gameTestServer"
            gameDirectory = project.file('run-gametest')
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        data {
            data()
            gameDirectory = project.file('run-data')

            // example of overriding the workingDirectory set in configureEach above, uncomment if you want to use it
            // gameDirectory = project.file('run-data')

            // Specify the modid for data generation, where to output the resulting resource, and where to look for existing resources.
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }

        // applies to all the run configs above
        configureEach {
            // Recommended logging data for a userdev environment
            // The markers can be added/remove as needed separated by commas.
            // "SCAN": For mods scan.
            // "REGISTRIES": For firing of registry events.
            // "REGISTRYDUMP": For getting the contents of all registries.
            systemProperty 'forge.logging.markers', 'REGISTRIES'

            // Recommended logging level for the console
            // You can set various levels here.
            // Please read: https://stackoverflow.com/questions/2031163/when-to-use-the-different-log-levels
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        // define mod <-> source bindings
        // these are used to tell the game which sources are for which mod
        // multi mod projects should define one per mod
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

// FTB Quests reads `<gameDir>/config/ftbquests/quests/`; ProgressiveStages reads `config/ProgressiveStages/`.
// Canonical copies live under examples/dev-progression/ only — without syncing, the quest book UI is empty.
tasks.register('syncDevProgressionConfigsClient', Sync) {
    group = 'mod development'
    description = 'Copies examples/dev-progression into run-client/config/ (FTB Quests + ProgressiveStages).'
    duplicatesStrategy = DuplicatesStrategy.INCLUDE
    into(layout.projectDirectory.dir('run-client/config'))
    from(layout.projectDirectory.dir('examples/dev-progression/ftbquests')) {
        into('ftbquests')
    }
    from(layout.projectDirectory.dir('examples/dev-progression/ProgressiveStages')) {
        into('ProgressiveStages')
    }
}
tasks.register('syncDevProgressionConfigsServer', Sync) {
    group = 'mod development'
    description = 'Copies examples/dev-progression into run-server/config/ (FTB Quests + ProgressiveStages).'
    duplicatesStrategy = DuplicatesStrategy.INCLUDE
    into(layout.projectDirectory.dir('run-server/config'))
    from(layout.projectDirectory.dir('examples/dev-progression/ftbquests')) {
        into('ftbquests')
    }
    from(layout.projectDirectory.dir('examples/dev-progression/ProgressiveStages')) {
        into('ProgressiveStages')
    }
}
tasks.register('syncDevProgressionConfigs') {
    group = 'mod development'
    description = 'Copies examples/dev-progression into both run-client and run-server config/.'
    dependsOn('syncDevProgressionConfigsClient', 'syncDevProgressionConfigsServer')
}
tasks.named('runClient').configure { dependsOn('syncDevProgressionConfigsClient') }
tasks.named('runServer').configure { dependsOn('syncDevProgressionConfigsServer') }

// Sets up a dependency configuration called 'localRuntime'.
// This configuration should be used instead of 'runtimeOnly' to declare
// a dependency that will be present for runtime testing but that is
// "optional", meaning it will not be pulled by dependents of this mod.
configurations {
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    // Example optional mod dependency with JEI
    // The JEI API is declared for compile time use, while the full JEI artifact is used at runtime
    // compileOnly "mezz.jei:jei-${mc_version}-common-api:${jei_version}"
    // compileOnly "mezz.jei:jei-${mc_version}-neoforge-api:${jei_version}"
    // We add the full version to localRuntime, not runtimeOnly, so that we do not publish a dependency on it
    // localRuntime "mezz.jei:jei-${mc_version}-neoforge:${jei_version}"

    // Example mod dependency using a mod jar from ./libs with a flat dir repository
    // This maps to ./libs/coolmod-${mc_version}-${coolmod_version}.jar
    // The group id is ignored when searching -- in this case, it is "blank"
    // implementation "blank:coolmod-${mc_version}:${coolmod_version}"

    // Example mod dependency using a file as dependency
    // implementation files("libs/coolmod-${mc_version}-${coolmod_version}.jar")

    // Example project dependency using a sister or child project:
    // implementation project(":myproject")

    // For more info:
    // http://www.gradle.org/docs/current/userguide/artifact_dependencies_tutorial.html
    // http://www.gradle.org/docs/current/userguide/dependency_management.html
}

// This block of code expands all declared replace properties in the specified resource targets.
// A missing property will result in an error. Properties are expanded using ${} Groovy notation.
var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : project.version.toString(),
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
// Include the output of "generateModMetadata" as an input directory for the build
// this works with both building through Gradle and the IDE.
sourceSets.main.resources.srcDir generateModMetadata
// To avoid having to run "generateModMetadata" manually, make it run on every project reload
neoForge.ideSyncTask generateModMetadata

// Example configuration to allow publishing using the maven-publish plugin
publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8' // Use the UTF-8 charset for Java compilation
}

// IDEA no longer automatically downloads sources/javadoc jars for dependencies, so we need to explicitly enable the behavior.
idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}

def curseforgeClientManifestOut = layout.buildDirectory.file('tmp/curseforge-client/manifest.json')
def curseforgeServerManifestOut = layout.buildDirectory.file('tmp/curseforge-server/manifest.json')
def curseforgeServerModJarsDir = layout.buildDirectory.dir('tmp/curseforge-server/mod-jars')

// CurseForge zips embed examples/dev-progression/ftbquests — fail before zip if the canonical tree is incomplete.
tasks.register('verifyDevProgressionFtbQuests') {
    group = 'verification'
    description = 'Ensures examples/dev-progression/ftbquests has required SNBT (client + server modpack zips embed this tree).'
    def ftbRoot = layout.projectDirectory.dir('examples/dev-progression/ftbquests')
    inputs.file(ftbRoot.file('quests/data.snbt'))
    inputs.file(ftbRoot.file('quests/chapters/project_island.snbt'))
    inputs.file(ftbRoot.file('quests/chapters/rpg_series.snbt'))
    doLast {
        def rootDir = ftbRoot.asFile
        def required = [
            'quests/data.snbt',
            'quests/chapters/project_island.snbt',
            'quests/chapters/rpg_series.snbt',
        ]
        required.each { rel ->
            def f = new File(rootDir, rel)
            if (!f.isFile()) {
                throw new GradleException(
                        "Missing required FTB Quest file: ${f.absolutePath}. Maintain chapters under examples/dev-progression/ftbquests/ before ./gradlew curseforgeModpackZip or curseforgeServerPackZip.")
            }
        }
    }
}

tasks.register('syncManifestModJarsToDevRuns', Exec) {
    group = 'distribution'
    description = 'Downloads every CurseForge manifest mod JAR into run-server/mods and run-client/mods (requires python3; public CurseForge + Forge CDN). Run after bumping manifest pins.'
    workingDir = layout.projectDirectory.asFile
    commandLine 'python3', 'tools/curseforge_pack/sync_manifest_mods_to_dev_runs.py', '--manifest', 'modpack/curseforge/manifest.json'
}

// Shipped under modpack/curseforge/overrides/mods/ for curseforgeServerPackZip (fat server overrides/mods).
// Omitted from curseforgeModpackZip so the CurseForge app does not get duplicate jars alongside manifest pins.
// Omitted from copyCurseforgeServerModJarsFromRunServer so the server zip does not list the same path twice.
def curseforgeServerPackModsBundledInRepoOverrides = [
    'travelersbackpack-neoforge-1.21.1-10.1.35.jar',
    'gravestone-neoforge-1.21.1-1.0.37.jar',
    'FallingTree-1.21.1-1.21.1.11.jar',
].toSet()

// Host-facing list of these filenames + download hints: modpack/curseforge/overrides/SERVER_README.md (bundled in client + server zips under overrides/).
// Omitted from curseforgeServerPackZip overrides/mods (not redistributable in our server zip; hosts install matching JARs from official sources).
def curseforgeServerPackUndistributableModJars = [
    'GlitchCore-neoforge-1.21.1-2.1.0.0.jar',
    'TerraBlender-neoforge-1.21.1-4.1.0.8 (1).jar',
    'balm-neoforge-1.21.1-21.0.57.jar',
    'bettervillage-neoforge-1.21.1-3.3.1.jar',
    'waystones-neoforge-1.21.1-21.1.32.jar',
].toSet()

tasks.register('writeCurseforgeClientManifest') {
    group = 'distribution'
    description = 'Writes build/tmp/curseforge-client/manifest.json with version = project.version (gradle.properties mod_version, optional +t timestamp).'
    def manifestIn = layout.projectDirectory.file('modpack/curseforge/manifest.json')
    def packVersion = version.toString()
    inputs.file(manifestIn)
    outputs.file(curseforgeClientManifestOut)
    doLast {
        def slurp = new groovy.json.JsonSlurper()
        def base = slurp.parse(manifestIn.asFile)
        base.version = packVersion
        def out = curseforgeClientManifestOut.get().asFile
        out.parentFile.mkdirs()
        out.text = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(base))
    }
}

tasks.register('curseforgeModpackZip', Zip) {
    dependsOn tasks.named('writeCurseforgeClientManifest'), tasks.named('verifyDevProgressionFtbQuests')
    group = 'distribution'
    description = 'CurseForge client modpack zip (manifest + overrides + FTB quest SNBT). Project Island is a manifest pin (CurseForge project 1534225) — do not ship projectisland-*.jar under overrides/mods (CurseForge moderation rejects hosted mods duplicated in the zip).'
    archiveFileName = "${mod_id}-modpack-${version}-curseforge.zip"
    destinationDirectory = layout.buildDirectory.dir('dist')
    duplicatesStrategy = DuplicatesStrategy.WARN
    from(layout.projectDirectory.dir('modpack/curseforge')) {
        exclude 'manifest.json'
        curseforgeServerPackModsBundledInRepoOverrides.each { fn -> exclude "overrides/mods/${fn}" }
    }
    from(curseforgeClientManifestOut) {
        rename { 'manifest.json' }
    }
    // Same SNBT as Gradle dev sync (examples/dev-progression); FTB reads <instance>/config/ftbquests/
    from(layout.projectDirectory.dir('examples/dev-progression/ftbquests')) {
        into 'overrides/config/ftbquests'
    }
}

tasks.register('copyCurseforgeServerModJarsFromRunServer') {
    group = 'distribution'
    description = 'Copies third-party mod JARs from run-server/mods into the server pack staging dir (excludes this mod\'s jar, undistributable filenames, and JARs listed in curseforgeServerPackModsBundledInRepoOverrides — those ship from modpack/curseforge/overrides/mods/). Requires a populated run-server — see MOD_LIST.md / ./gradlew runServer.'
    def srcDir = layout.projectDirectory.dir('run-server/mods')
    def modId = mod_id
    outputs.dir(curseforgeServerModJarsDir)
    doLast {
        // layout.projectDirectory.dir(...) is a Directory (not a Provider) — use .asFile / getAsFile(), not .get().
        def src = srcDir.asFile
        if (!src.isDirectory()) {
            throw new GradleException("Missing folder ${src.absolutePath}. Populate run-server/mods (e.g. ./gradlew runServer once, or copy JARs from MOD_LIST.md), then run curseforgeServerPackZip again.")
        }
        def dest = curseforgeServerModJarsDir.get().asFile
        dest.mkdirs()
        dest.eachFile { f ->
            if (f.isFile() && f.name.endsWith('.jar')) {
                f.delete()
            }
        }
        def copied = 0
        src.eachFile { f ->
            if (f.isFile() && f.name.endsWith('.jar') && !f.name.startsWith("${modId}-") && !curseforgeServerPackUndistributableModJars.contains(f.name) && !curseforgeServerPackModsBundledInRepoOverrides.contains(f.name)) {
                java.nio.file.Files.copy(f.toPath(), new File(dest, f.name).toPath(), java.nio.file.StandardCopyOption.REPLACE_EXISTING)
                copied++
            }
        }
        if (copied == 0) {
            throw new GradleException("No third-party .jar files found in ${src.absolutePath} after excluding ${modId}-*.jar. Add mod JARs there (see MOD_LIST.md).")
        }
    }
}

tasks.register('writeCurseforgeServerManifest') {
    group = 'distribution'
    description = 'Writes build/tmp/curseforge-server/manifest.json: server name, version from Gradle, files = [] (Project Island ships as projectisland-*.jar under overrides/mods; client pack uses manifest pin only).'
    dependsOn tasks.named('writeCurseforgeClientManifest')
    inputs.file(curseforgeClientManifestOut)
    outputs.file(curseforgeServerManifestOut)
    doLast {
        def slurp = new groovy.json.JsonSlurper()
        def base = slurp.parse(curseforgeClientManifestOut.get().asFile)
        base.name = "${base.name} (Server)"
        // Server additional zip: ship our mod JAR in overrides/mods; empty files[] avoids launcher double-fetch vs client moderation (no PI jar in client zip).
        base.files = []
        def out = curseforgeServerManifestOut.get().asFile
        out.parentFile.mkdirs()
        out.text = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(base))
    }
}

tasks.register('curseforgeServerPackZip', Zip) {
    dependsOn tasks.named('writeCurseforgeServerManifest'), tasks.named('copyCurseforgeServerModJarsFromRunServer'), tasks.named('verifyDevProgressionFtbQuests'), tasks.named('jar')
    group = 'distribution'
    description = 'CurseForge dedicated server pack: fat overrides/mods (JARs from run-server/mods staging + jar task output for Project Island + committed modpack/curseforge/overrides/mods/*.jar). Server manifest files[] is empty so PI is not duplicated via manifest download. Client curseforgeModpackZip stays manifest-only for PI (CurseForge moderation).'
    archiveFileName = "${mod_id}-modpack-${version}-curseforge-server.zip"
    destinationDirectory = layout.buildDirectory.dir('dist')
    duplicatesStrategy = DuplicatesStrategy.WARN
    from(layout.projectDirectory.dir('modpack/curseforge')) {
        exclude 'manifest.json'
        exclude 'modlist.html'
        exclude 'server-pack-excluded-project-ids.json'
        exclude 'overrides/config/resourcepackoverrides.json'
        exclude 'overrides/resourcepacks/**'
        exclude 'overrides/shaderpacks/**'
        // JARs under overrides/mods/ come from copyCurseforgeServerModJarsFromRunServer + explicit from(...) below (avoid duplicate zip entries).
        exclude 'overrides/mods/*.jar'
    }
    from(layout.projectDirectory.dir('examples/dev-progression/ftbquests')) {
        into 'overrides/config/ftbquests'
    }
    from(curseforgeServerManifestOut) {
        rename { 'manifest.json' }
    }
    from(curseforgeServerModJarsDir) {
        into 'overrides/mods'
    }
    from(layout.projectDirectory.dir('modpack/curseforge/overrides/mods')) {
        include '*.jar'
        exclude { curseforgeServerPackUndistributableModJars.contains(it.name) }
        into 'overrides/mods'
    }
    from(tasks.named('jar', org.gradle.api.tasks.bundling.Jar).flatMap { it.archiveFile }) {
        into 'overrides/mods'
    }
}

tasks.register('curseforgeModpackAll') {
    group = 'distribution'
    description = 'Builds curseforgeModpackZip and curseforgeServerPackZip.'
    dependsOn('curseforgeModpackZip', 'curseforgeServerPackZip')
}
