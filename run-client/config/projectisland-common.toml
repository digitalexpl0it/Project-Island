#Log extra diagnostics during client and common setup (off by default for quieter logs).
debugLogging = false
#In the floating-islands overworld, each vanilla monster room or trial chamber that generates in a chunk is kept with this probability (0 = remove all, 1 = keep all).
#Lowering this reduces floating stone ruins in the void; raising it preserves more combat structures.
# Default: 0.12
# Range: 0.0 ~ 1.0
floatingIslandsRareStructureKeepChance = 0.12
#Weight for minecraft:river when rolling per-island biome (0 = never). Land uses procedural biomes, not vanilla multi_noise sectors.
# Default: 28
# Range: 0 ~ 1000
islandBiomeWeightRiver = 28
#Weight for minecraft:plains (0 = exclude).
# Default: 14
# Range: 0 ~ 1000
islandBiomeWeightPlains = 14
#Weight for minecraft:forest (0 = exclude).
# Default: 14
# Range: 0 ~ 1000
islandBiomeWeightForest = 14
#Weight for minecraft:taiga (0 = exclude).
# Default: 10
# Range: 0 ~ 1000
islandBiomeWeightTaiga = 10
#Weight for minecraft:desert (0 = exclude).
# Default: 8
# Range: 0 ~ 1000
islandBiomeWeightDesert = 8
#Weight for minecraft:snowy_plains (0 = exclude).
# Default: 8
# Range: 0 ~ 1000
islandBiomeWeightSnowyPlains = 8
#Weight for minecraft:jungle (0 = exclude).
# Default: 6
# Range: 0 ~ 1000
islandBiomeWeightJungle = 6
#Weight for minecraft:mushroom_fields (0 = exclude).
# Default: 2
# Range: 0 ~ 1000
islandBiomeWeightMushroomFields = 2
#Weight for minecraft:badlands (0 = exclude).
# Default: 4
# Range: 0 ~ 1000
islandBiomeWeightBadlands = 4
#Weight for minecraft:windswept_forest (0 = exclude).
# Default: 4
# Range: 0 ~ 1000
islandBiomeWeightWindsweptForest = 4
#Weight for minecraft:swamp (0 = exclude).
# Default: 6
# Range: 0 ~ 1000
islandBiomeWeightSwamp = 6
#After normal biome decoration, try to place this many extra oak / fancy oak / birch trees on grass island tops per chunk (0 disables).
# Default: 5
# Range: 0 ~ 32
floatingIslandsExtraSurfaceTreesPerChunk = 5
#On server start, pregenerate chunks in an L-infinity (Chebyshev) neighborhood around overworld spawn.
#0 disables. Small values (e.g. 4–8) reduce first-join hitching; large values slow server startup.
# Default: 0
# Range: 0 ~ 128
spawnPregenChunkRadius = 0
#How many FULL chunks to load per server tick while spawn pregeneration is running (minimum 1).
# Default: 4
# Range: 1 ~ 64
spawnPregenChunksPerTick = 4
#When true, players in the floating-islands overworld receive periodic island state labels (available / claimed / contested).
#When false, the server sends an empty list on the same interval so clients clear any stale HUD.
islandHudSyncEnabled = true
#How often each player is sent an island HUD update (in ticks, 20 = 1 second).
# Default: 40
# Range: 1 ~ 600
islandHudSyncIntervalTicks = 40
#Chebyshev radius in island regions around the player to include in each HUD sync (0 = only the player's current region).
# Default: 10
# Range: 0 ~ 48
islandHudRegionScanRadius = 10
#Vertical offset in blocks above each island's procedural surface peak for the HUD anchor.
# Default: 20
# Range: 4 ~ 128
islandHudHeightAbovePeakBlocks = 20
#On first join to the floating-islands overworld, assign one AVAILABLE island region as the player's starter home (CLAIMED + persisted), then teleport to that island's procedural center (HUD-aligned).
#Players who already have a starter home entry are unchanged. Void rescue still runs afterward if needed.
starterIslandAutoAssignEnabled = true
#When true, the starter region spiral anchors at world block column (0, 0) (region containing that column).
#Takes precedence over starterIslandSearchFromWorldSpawn when enabled.
starterIslandSearchFromWorldOrigin = false
#When starterIslandSearchFromWorldOrigin is false: if true, the spiral starts at the overworld shared spawn chunk.
#If false, the spiral starts at the player's join chunk (useful for tests).
starterIslandSearchFromWorldSpawn = true
#Chebyshev radius in island regions (8×8 chunks each) when searching for an AVAILABLE starter candidate.
#Increase on dense servers if nearby regions are all claimed.
# Default: 96
# Range: 1 ~ 4096
starterIslandMaxRegionSearchRadius = 96
#Minimum Chebyshev distance in regions between a new starter island and any existing starter home island.
#0 disables separation checks.
# Default: 0
# Range: 0 ~ 256
starterIslandMinRegionSeparation = 0
#If non-empty and no starter island could be assigned within the search radius, disconnect the joining player with this literal message (otherwise they stay at join position and void rescue may still run).
starterIslandFailureKickMessage = ""
#When true, the server watches floating-islands overworld players in the void: optional **last-safe** mid-fall snap (voidRescueSnapToLastSafe*), then **once per fall** near the world minimum Y (voidRescueTriggerBlocksAboveMinY).
#Join / dimension change still runs immediate void relocation when you are not on a surface.
voidRescueEachTick = true
#With voidRescueEachTick: when feet Y is at or below (minBuildHeight + this value), run rescue if still not supported.
#This is the **void-floor band** only — keep it small so dungeons / stairs far above the world minimum are not mistaken for the void. Vanilla overworld min is -64; 12 ⇒ rescue at Y≤-52 unless you raise this.
#Join / dimension relocate still runs when unsupported at any height (see FloatingIslandVoidRescue).
# Default: 12
# Range: 0 ~ 512
voidRescueTriggerBlocksAboveMinY = 12
#While falling through open void (no island support), teleport you back to the last feet position that was on solid / island surface once you drop voidRescueSnapToLastSafeMinFallBlocks below that Y.
#Shortens long void falls that can trigger vanilla 'Flying is not enabled on this server' with allow-flight=false.
voidRescueSnapToLastSafeEnabled = true
#Vertical gap below the saved last-safe Y before the mid-void snap runs. Lower = sooner rescue (safer vs flight kick); too low can feel harsh on intentional drops.
# Default: 20
# Range: 4 ~ 256
voidRescueSnapToLastSafeMinFallBlocks = 20
#Ticks after a last-safe snap before another mid-void snap can run (prevents thrash if the spot is no longer valid).
# Default: 40
# Range: 0 ~ 200
voidRescueSnapToLastSafeCooldownTicks = 40
#When true, players in the floating-islands overworld receive rope anchor segment positions for client rendering.
#When false, the server sends an empty list on the same interval so clients clear stale segments.
ropeLinkSyncEnabled = true
#How often each player is sent a rope link update (in ticks, 20 = 1 second).
# Default: 20
# Range: 1 ~ 600
ropeLinkSyncIntervalTicks = 20
#A rope segment is included if either anchor or the midpoint is within this horizontal Chebyshev distance (blocks) of the player.
#Increase if long spans disappear while you stand between islands.
# Default: 384
# Range: 32 ~ 2048
ropeLinkSyncCullRadiusBlocks = 384
#Harpoon gun raycast reach (blocks) for each shot when placing rope anchors.
#Should be **≥ ropeLinkMaxLengthBlocks** so you can aim at the far island from the near one; defaults match max span.
# Default: 256
# Range: 8 ~ 512
ropeLinkRaycastRangeBlocks = 256
#Maximum Euclidean distance (blocks) between two anchors for a new rope link (server-validated).
#Default **256** fits typical floating-neighbor islands (~117+ blocks is common); raise up to **1024** for rare layouts. Stored on each RopeLink for strain / future rules.
# Default: 256
# Range: 16 ~ 1024
ropeLinkMaxLengthBlocks = 256
#Maximum (and initial) hit points per rope link. Strain lowers health; at 0 the link snaps and anchors restore.
# Default: 100.0
# Range: 1.0 ~ 1000000.0
ropeLinkMaxHealth = 100.0
#When true, when a player unlocks a higher rope tier (advancement), existing RopeLinks they own are upgraded server-side (max length + max health).
#Upgrades preserve the current health fraction. Disable if you want tiers to affect new links only.
ropeProgressionUpgradeExistingLinks = true
#How often (ticks) to scan and upgrade existing rope links when ropeProgressionUpgradeExistingLinks is enabled.
# Default: 200
# Range: 1 ~ 20000
ropeProgressionUpgradeIntervalTicks = 200
#Server ticks between strain evaluations (span vs max length) and optional damage. 20 ≈ once per second.
# Default: 20
# Range: 1 ~ 1200
ropeLinkStressTickInterval = 20
#When chord length / maxLinkLength exceeds this ratio, the rope takes strain damage each stress tick (e.g. 0.88 = 88% of allowed span).
# Default: 0.88
# Range: 0.5 ~ 0.999
ropeLinkStrainRatioThreshold = 0.88
#Hit points removed per stress tick while over the strain threshold. Scales up as span approaches max length.
# Default: 1.5
# Range: 0.0 ~ 10000.0
ropeLinkStrainDamagePerTick = 1.5
#When true, completing a harpoon link must keep the network connected to your starter island and within depth / spoke caps below.
#Turn off only for unrestricted testing.
ropeTopologyEnabled = true
#Maximum BFS hop count from the starter region along **your** ropes (0 = starter only). Value **2** allows starter → secondary → tertiary when **ropeAllowTertiaryIslandLinks** is true; otherwise depth is capped at **1** regardless of this number.
# Default: 2
# Range: 0 ~ 8
ropeTopologyMaxDepthFromStarter = 2
#When **false** (default), topology never lets a rope put an island **two hops** from your starter (only the hub + one ring). Set **true** to apply the full **ropeTopologyMaxDepthFromStarter** depth (e.g. 2 = tertiary islands). Advancement-based unlocks can replace this toggle later.
ropeAllowTertiaryIslandLinks = false
#Max **distinct** other regions linked **directly** to your starter by your ropes (default **1**; raise up to **4** as a stand-in until advancement gates exist).
# Default: 1
# Range: 1 ~ 4
ropeMainDirectSpokeCap = 1
#Per **claimed** non-starter region you own: max distinct **non-starter** rope neighbors (links back to the starter excluded). Default **1**, max **3**.
# Default: 1
# Range: 1 ~ 3
ropeSisterOutboundCap = 1
#When true, secondary claims require a harpoon RopeLink owned by the claimer between the target island and an island they already own (starter or prior claim).
secondaryClaimRequiresRopeLink = true
#For `/projectisland island claim` only: if > 0, require the player to be within this horizontal distance (blocks) of a rope anchor endpoint on the target island that is part of a valid owned link (per secondaryClaimRequiresRopeLink gate).
#Set to 0 to disable the proximity requirement.
# Default: 160
# Range: 0 ~ 2048
secondaryClaimCommandMaxDistanceBlocks = 160
#When true, completing a harpoon link immediately **claims** an **AVAILABLE** endpoint if the other endpoint is your **starter home** or an island you already **claim** (no shift-click needed). Turn off to require anchor sneak-use or `/projectisland island claim` only.
autoClaimIslandOnRopeLink = true
#Minimum permission level for `/projectisland island claim` (0 = any player; 2 = OP on vanilla).
#Rope-anchor shift-use is not gated by this — only the Brigadier command.
# Default: 0
# Range: 0 ~ 4
secondaryClaimCommandPermissionLevel = 0
