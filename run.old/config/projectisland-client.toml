#Draw synced island HUD labels when the world uses Project Island floating-islands generation (server can still send data when disabled).
islandHudShow = true
#World-space scale for debug-style floating text (vanilla debug labels use 0.02).
# Default: 0.056
# Range: 0.024 ~ 0.11
islandHudTextScale = 0.056
#Use see-through text so labels stay readable when blocks or terrain sit in front of them.
islandHudSeeThroughText = true
#Blend label colors toward white when the sky is dark and local light is low (0 = off, 1 = strongest).
#Improves readability at night without changing daytime appearance much.
# Default: 0.72
# Range: 0.0 ~ 1.0
islandHudNightColorBoost = 0.72
#Alpha for the **dark fill** behind island HUD billboard text (0 = invisible, 1 = opaque).
#Default matches the previous hard-coded panel (~85% opacity); lower for a more see-through HUD.
# Default: 0.8470588235294118
# Range: 0.0 ~ 1.0
islandHudPanelFillOpacity = 0.8470588235294118
#Alpha for the **tinted border** around the island HUD panel (0–1).
# Default: 0.92
# Range: 0.0 ~ 1.0
islandHudPanelBorderOpacity = 0.92
#Scales **padding, icon slot, and border** for the island HUD billboard (1 = legacy size).
#Text size still follows **islandHudTextScale**; title ellipsis width scales with this value.
# Default: 1.0
# Range: 0.35 ~ 2.5
islandHudPanelScale = 1.0
#Draw synced rope segments between linked anchors in the floating-islands overworld (server still sends data when disabled).
ropeLinksShow = true
#Draw small billboard health bars at each rope anchor when rope rendering is enabled (uses synced health fraction).
ropeLinkHealthBarsShow = true
